[unstable]
# build-std = ["std", "panic_abort", "core", "alloc"]
# build-std-features = ["panic_immediate_abort"]

[alias]
playwright-regression = "run -p playwright_regression -- --dist-dir example_motion/dist"

[build]
# Keep build flags minimal for smaller generated bindings and simpler builds.
# rustflags = ["-Z", "threads=4"]

# [profile.dev]
# opt-level = 1

# [profile.dev.package."*"]
# opt-level = 3

[profile.release]
# Do not perform backtrace for panic on release builds.
panic = 'abort'
# Perform optimizations on all codegen units.
codegen-units = 1
# Optimize for size.
opt-level = 'z' # 's' for speed or 'z' to optimize "aggressively" for size
# Enable link time optimization.
lto = true
strip = "symbols"
