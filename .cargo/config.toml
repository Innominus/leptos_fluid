[unstable]
# Rebuild std/core/alloc/panic_abort from source so the release profile's
# `panic = "immediate-abort"` can strip panic formatting + unwinding tables
# from the standard library itself. Nightly-only. Saves ~3% on release wasm
# (measured on leptos_fluid_scroll_example: 1,323,165 -> 1,281,794 raw,
# 1,204,178 -> 1,169,049 after wasm-opt -Oz).
# Dev-build cost: +~30s cold-cache per target (one-time).
build-std = ["std", "panic_abort", "core", "alloc"]

[alias]
playwright-regression = "run -p playwright_regression -- --dist-dir example_motion/dist"

[build]
# Enable web-sys APIs currently gated behind `web_sys_unstable_apis`, including
# fractional Element scroll positions. This also helps rust-analyzer/intellisense
# see the same API surface as project builds.
rustflags = ["--cfg=web_sys_unstable_apis", "--check-cfg=cfg(web_sys_unstable_apis)"]
# Keep build flags minimal for smaller generated bindings and simpler builds.
# rustflags = ["-Z", "threads=4"]

# [profile.dev]
# opt-level = 1

# [profile.dev.package."*"]
# opt-level = 3

[profile.release]
# `immediate-abort` (stabilized on nightly 1.97+, gated by the workspace-level
# `cargo-features = ["panic-immediate-abort"]` in Cargo.toml:1) drops panic
# messages and backtraces entirely. Acceptable for release wasm (panics are
# fatal regardless). Requires build-std above so core/std are compiled with
# this panic strategy. No crate in this workspace uses catch_unwind, so this
# is safe across motion/flip/view_transitions/web/scroll.
panic = 'immediate-abort'
# Perform optimizations on all codegen units.
codegen-units = 1
# Optimize for size.
opt-level = 'z' # 's' for speed or 'z' to optimize "aggressively" for size
# Enable link time optimization.
lto = true
strip = "symbols"
