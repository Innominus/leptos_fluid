[package]
name = "leptos_fluid_flip"
version = "0.1.1"
edition = "2024"

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
web-sys = { version = "0.3.69", features = [
    "DomRect",
    "Element",
    "Animation",
    "KeyframeAnimationOptions",
    "FillMode",
    "CssStyleDeclaration",
    "Window",
    "HtmlElement",
    "Document",
    "NodeList",
] }
