[package]
name = "leptos_fluid_motion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reactive motion primitives for Leptos components with spring and timeline support."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/leptos_fluid_motion"
keywords = ["leptos", "animation", "motion", "ui", "wasm"]
categories = ["wasm", "web-programming", "gui"]

[features]
bench = []

[dependencies]
leptos = { workspace = true }
js-sys = { workspace = true }
leptos_fluid_web = { workspace = true }
web-sys = { workspace = true, features = [
    "Element",
    "Animation",
    "CssStyleDeclaration",
    "Window",
] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "animation"
harness = false

[package.metadata.docs.rs]
all-features = true
