[package]
name = "leptos_fluid_example"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos_fluid = { path = "../", features = ["view-transitions", "motion"] }
leptos = { version = "0.8", default-features = false, features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
gloo-net = { version = "0.5", features = ["http"] }
console_error_panic_hook = { version = "0.1" }
web-sys = { version = "0.3.69", features = ["DomRect", "Element", "Storage"] }
uuid = { version = "1.10.0", features = ["v4", "fast-rng", "js"] }
chrono = { version = "0.4.38", features = ["serde"] }
